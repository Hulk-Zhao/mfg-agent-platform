<svg width="620" height="228" viewBox="0 0 620 228" xmlns="http://www.w3.org/2000/svg"><text x="0" y="16" font-size="12" font-weight="bold" fill="#334155">双闸实测：问「报销流程」时，流程卡稳赢单事实卡</text><line x1="90" y1="34" x2="560" y2="34" stroke="#E2E8F0" stroke-width="1" /><text x="0" y="60" font-size="12" fill="#0F172A">流程卡</text><rect x="90" y="44" width="470" height="26" rx="6" fill="#2563EB" /><text x="566" y="62" font-size="12" font-weight="bold" fill="#1E40AF">1.0</text><text x="0" y="102" font-size="12" fill="#0F172A">单事实卡</text><rect x="90" y="86" width="376" height="26" rx="6" fill="#06B6D4" /><text x="472" y="104" font-size="12" font-weight="bold" fill="#0E7490">0.8</text><line x1="419" y1="30" x2="419" y2="150" stroke="#F97316" stroke-width="2" stroke-dasharray="5 4" /><text x="419" y="24" font-size="11" font-weight="bold" fill="#C2410C" text-anchor="middle">第一闸 0.70</text><line x1="90" y1="150" x2="560" y2="150" stroke="#CBD5E1" stroke-width="1" /><text x="90" y="168" font-size="10" fill="#94A3B8" text-anchor="middle">0</text><text x="325" y="168" font-size="10" fill="#94A3B8" text-anchor="middle">0.5</text><text x="560" y="168" font-size="10" fill="#94A3B8" text-anchor="middle">1.0</text><path d="M 466 128 L 466 138 L 560 138 L 560 128" stroke="#F97316" stroke-width="1.5" fill="none" /><text x="513" y="132" font-size="11" font-weight="bold" fill="#C2410C" text-anchor="middle">margin 0.2</text><rect x="0" y="186" width="620" height="36" rx="8" fill="#FFF7ED" stroke="#FED7AA" /><text x="14" y="208" font-size="11" fill="#9A3412">第二闸：top1 − top2 ≥ 0.15 才认「明显更像」。被压侧 0.8 仍高于 0.70——是稳赢，不是险胜。</text></svg>