<svg width="1120" height="276" viewBox="0 0 1120 276" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="6" width="880" height="44" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" /><text x="18" y="25" font-size="14" font-weight="bold" fill="#1E40AF">① BGE-M3 双路编码</text><text x="18" y="42" font-size="11" fill="#1E3A8A">dense 1024 维 + sparse 稀疏向量，双路同时召回</text><path d="M 22 50 L 22 60" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)" /><rect x="0" y="64" width="740" height="44" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" /><text x="18" y="83" font-size="14" font-weight="bold" fill="#1E40AF">② Milvus 混合召回</text><text x="18" y="100" font-size="11" fill="#1E3A8A">WeightedRanker 0.7 / 0.3 加权融合两路分数</text><path d="M 22 108 L 22 118" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)" /><rect x="0" y="122" width="600" height="44" rx="8" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5" /><text x="18" y="141" font-size="14" font-weight="bold" fill="#0E7490">③ 候选集</text><text x="18" y="158" font-size="11" fill="#155E75">max(12, top_k×3) 条进入重排，宁多勿漏</text><path d="M 22 166 L 22 176" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)" /><rect x="0" y="180" width="460" height="44" rx="8" fill="#ECFEFF" stroke="#A5F3FC" stroke-width="1.5" /><text x="18" y="199" font-size="14" font-weight="bold" fill="#0E7490">④ BGE-Reranker-v2-M3 重排</text><text x="18" y="216" font-size="11" fill="#155E75">CrossEncoder 对「查询-文档」对精细打分</text><path d="M 22 224 L 22 234" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arr)" /><rect x="0" y="238" width="320" height="34" rx="8" fill="#0F172A" /><text x="18" y="260" font-size="13" font-weight="bold" fill="#FFFFFF">⑤ top_n 交给出处生成</text><rect x="900" y="6" width="220" height="128" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5" /><text x="914" y="28" font-size="12" font-weight="bold" fill="#C2410C">为什么双路？</text><text x="914" y="48" font-size="10" fill="#9A3412">dense 管「说得不一样」：</text><text x="914" y="63" font-size="10" fill="#9A3412">同义、口语、省略都能召回；</text><text x="914" y="78" font-size="10" fill="#9A3412">sparse 管「术语精确」：</text><text x="914" y="93" font-size="10" fill="#9A3412">CPK、8D、ECN 一个不糊。</text><text x="914" y="116" font-size="10" font-weight="bold" fill="#C2410C">两路一起，才叫混合检索。</text><rect x="900" y="146" width="220" height="126" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" /><text x="914" y="168" font-size="12" font-weight="bold" fill="#1E40AF">为什么重排？</text><text x="914" y="188" font-size="10" fill="#1E3A8A">双路召回是「粗筛」，</text><text x="914" y="203" font-size="10" fill="#1E3A8A">分数来自两套不完全一致</text><text x="914" y="218" font-size="10" fill="#1E3A8A">的度量；重排让查询和文档</text><text x="914" y="233" font-size="10" fill="#1E3A8A">真正对打一次，再定输赢。</text><text x="914" y="256" font-size="10" font-weight="bold" fill="#1E40AF">没有 rerank = 递半成品。</text></svg>