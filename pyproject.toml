[project]
name = "mfg-agent-platform"
version = "0.1.0"
description = "Manufacturing multi-agent platform: LangGraph orchestration across MES/QMS/SCM/EAM/WMS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.5.0",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.36.0",
    "numpy>=1.26.0",
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "pyyaml>=6.0",
]

[tool.uv]
package = true

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/mfg_agents"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
