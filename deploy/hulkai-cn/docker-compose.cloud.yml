# ============================================================
# hulkai.cn 轻量云部署编排（零中间件形态）
#
# 为什么不需要 MySQL / Milvus / Redis 容器：
#   DB_URL       留空 → 回落 SQLite（common/config.py:66）
#   VECTOR_BACKEND=chroma → ./data/chroma 本地文件（默认即此值）
#   REDIS_URL    留空 → 禁用缓存，连接失败自动降级（config.py 注释）
#
# 启动：docker compose -f docker-compose.cloud.yml up -d --build
# 自检：curl -i https://hulkai.cn/            → 应 302 到 /demo-ui/
#       curl https://hulkai.cn/api/v2/health  → 应含 "ok"
# ============================================================

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: mfg_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - webroot:/var/www/html
    depends_on:
      app:
        condition: service_healthy
    networks:
      - mfg_cloud

  app:
    build:
      context: ../..
      dockerfile: deploy/hulkai-cn/Dockerfile.cloud
    image: mfg-agent-platform:cloud
    container_name: mfg_app
    env_file:
      - path: .env
        required: true
    environment:
      PYTHONUNBUFFERED: "1"
      # 三重兜底：env_file 之外再加一层，防止有人误改成 milvus
      VECTOR_BACKEND: chroma
      CHROMA_HOST: localhost
      DB_URL: ""
      REDIS_URL: ""
      OLLAMA_BASE_URL: ""
    # 只绑宿主机回环：deploy.sh 第 6 步的宿主侧健康检查要用，
    # 但绝不对公网开放（api.log 里已有公网扫描记录）。
    ports:
      - "127.0.0.1:8004:8004"
    expose:
      - "8004"
    volumes:
      # SQLite / Chroma / 治理演示库都落在 /app/data，必须持久化
      - mfg_data:/app/data
    restart: unless-stopped
    networks:
      - mfg_cloud

volumes:
  mfg_data:
  webroot:

networks:
  mfg_cloud:
