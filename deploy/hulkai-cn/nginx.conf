# ============================================================
# hulkai.cn —— mfg-agent-platform 反向代理
#
# 三个被代码事实迫使的配置，缺一个都会出事：
#   ① 根路径兜底：v2/demo/api.py 只挂载了 /demo-ui 与 /demo-story，
#      根 / 没有任何路由 → 直接访问 hulkai.cn 是 404。
#   ② SSE 流式：api.py 里 StreamingResponse(media_type="text/event-stream")，
#      Nginx 默认 proxy_buffering on 会把流攒到结束一次性吐出，
#      打字机效果会变成"憋几十秒一次性出来"。
#   ③ 长连接超时：流式接口 wait_s 上限 300s（Query(120.0, le=300.0)），
#      Nginx 默认 proxy_read_timeout 60s 会先断。
# ============================================================

# 注意：nginx 与 app 是同 compose 里的两个容器，必须走 docker 网络
# 的服务名 app:8004。早期写成 127.0.0.1:8004 是照搬"宿主机 nginx"场景，
# 在容器里指向 nginx 自己的 loopback，全部请求 502。
upstream mfg_app {
    server app:8004;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hulkai.cn www.hulkai.cn;

    # 证书校验 / 搜索引擎校验用
    location /.well-known/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hulkai.cn www.hulkai.cn;

    ssl_certificate     /etc/letsencrypt/live/hulkai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hulkai.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;

    # ---- ① 根路径兜底 --------------------------------------
    location = / {
        return 302 /demo-ui/;
    }

    location / {
        proxy_pass http://mfg_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ---- ② SSE 关键 --------------------------------------
        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;

        # ---- ③ 长连接：必须大于接口 wait_s 上限 300s ---------
        proxy_connect_timeout 10s;
        proxy_send_timeout    330s;
        proxy_read_timeout    330s;
    }
}
