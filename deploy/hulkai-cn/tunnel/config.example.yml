# ============================================================
# hulkai.cn —— Cloudflare 命名隧道（cloudflared）配置
#
# 用法：
#   1) 复制本文件为同目录下的 config.yml
#   2) 把 <UUID> 换成 `cloudflared tunnel create hulkai` 输出的隧道 ID
#   3) 启动：scripts\start_domain_tunnel.bat
#
# 前置（一次性，在项目根目录执行）：
#   bin 目录外的 cloudflared 位于 .tools\cloudflared.exe
#   .tools\cloudflared.exe tunnel login
#   .tools\cloudflared.exe tunnel create hulkai
#   .tools\cloudflared.exe tunnel route dns hulkai hulkai.cn
#   .tools\cloudflared.exe tunnel route dns hulkai www.hulkai.cn
#
# 为什么用命名隧道而不是 quick tunnel：
#   quick tunnel 的 trycloudflare.com 地址每次重启都变；
#   命名隧道绑定自己的域名，且不需要云服务器、不需要开放入站端口、
#   HTTPS 由 Cloudflare 边缘自动签发（无需 Let's Encrypt）。
# ============================================================

tunnel: hulkai
credentials-file: C:\Users\22953\.cloudflared\<UUID>.json

# 可选：隧道自身的运行日志级别
loglevel: info

ingress:
  - hostname: hulkai.cn
    service: http://127.0.0.1:8004
  - hostname: www.hulkai.cn
    service: http://127.0.0.1:8004
  # 兜底规则必须存在：未匹配的 hostname 返回 404，而不是暴露本机其它端口
  - service: http_status:404
