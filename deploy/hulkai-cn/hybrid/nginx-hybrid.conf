# ============================================================
# hulkai.cn 混合部署：前端在云服务器（静态）/ 后端在本地（隧道）
#
# 关键设计：前端直接托管在根路径 / 而不是 /demo-ui/
# 原因：index.html 里全部是相对路径引用（app.css、./scenes/registry.js）。
#   托管在 /demo-ui/ 时，用户一旦写成 https://hulkai.cn/demo-ui（少个斜杠），
#   相对路径会被解析成 https://hulkai.cn/app.css → 404，整页白屏。
#   托管在根则天然没有这个歧义，且顺带解决了根路径无路由的老问题。
#
# 生效前提：云有公网 IP，本地后端经 WireGuard 或 frp 打隧道，
# Nginx 通过隧道对端地址访问本地 FastAPI。
# ============================================================

# ---- 隧道后端地址 ------------------------------------------
# 【方案 A】WireGuard：本地后端在 VPN 网段内的固定地址（推荐，见方案文档）
upstream mfg_backend {
    server 10.7.0.2:8004;
    keepalive 16;
}
# 【方案 B】frp：本地 frpc 把 8004 映射到云主机的 7000，则改成下面这一行
# upstream mfg_backend { server 127.0.0.1:7000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name hulkai.cn www.hulkai.cn;
    location /.well-known/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hulkai.cn www.hulkai.cn;

    ssl_certificate     /etc/letsencrypt/live/hulkai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hulkai.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    # ---- 后端 API：反代到本地隧道 --------------------------
    location /api/ {
        proxy_pass http://mfg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE 流式：不关缓冲的话，Agent 打字机会变成"憋完一次性吐出"
        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;

        # 接口 wait_s 上限 300s；WireGuard 方案可调到 330s。
        # 若走 Cloudflare Tunnel，这里再大也没用——CF 免费版在 100s 无数据时
        # 会先掐断并返回 524，见方案文档"方案 B 的硬限制"。
        proxy_connect_timeout 10s;
        proxy_send_timeout    330s;
        proxy_read_timeout    330s;
    }

    # A2A 端点也在后端，一并代理
    location /.well-known/agent.json {
        proxy_pass http://mfg_backend;
        proxy_set_header Host $host;
    }

    # ---- 前端静态：index.html 必须每次回源 ------------------
    # 后端自己托管时用的是 Cache-Control: no-store（见 api.py:185-191），
    # 静态托管必须复刻这条，否则浏览器长期缓存外壳，
    # 会一直引用旧的 ?v= 资源，表现为"改了前端但页面没变"。
    location = / {
        root  /var/www/mfg-ui;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
    }

    location = /index.html {
        root /var/www/mfg-ui;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
    }

    # ---- 其余静态资源 --------------------------------------
    # 带 ?v=<mtime> 版本号（由 inject-version.py 在部署时写入），
    # 因此这里可以放心长缓存：文件名不变则内容不变，变了则有新版本号。
    location / {
        root /var/www/mfg-ui;
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
