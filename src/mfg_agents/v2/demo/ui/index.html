<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-font="medium">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智造协同平台 · 运营协同门户</title>
  <meta name="description" content="制造业跨部门协同平台演示门户：工作台 / 订单履约 / 协同问数 / 预警中心 / 报告中心 / 人工确认 审批" />
  <!-- 首绘前确立显示偏好：默认「蓝色主题色 + 明亮 + 清晰字号」，已存过偏好的用户在这里一次性还原，
       避免主题/字号闪跳（theme-switcher.js 与 aging-mode.js 都是 defer，排在数百 KB 脚本之后才执行）。
       共用同一套 localStorage 键：mfg-theme / mfg-accent / mfg-font-scale / mfg-density。 -->
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var ls = window.localStorage;
        if (ls.getItem("mfg-theme") === "dark") root.setAttribute("data-theme", "dark");
        var accent = ls.getItem("mfg-accent");
        if (accent === "cyan" || accent === "violet" || accent === "orange") root.setAttribute("data-accent", accent);
        var font = ls.getItem("mfg-font-scale");
        if (font === "standard" || font === "medium" || font === "large") root.setAttribute("data-font", font);
        var density = ls.getItem("mfg-density");
        if (density === "compact" || density === "standard" || density === "loose") root.setAttribute("data-density", density);
      } catch (err) { /* 隐私模式禁用存储时按默认明亮进入 */ }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23185FA5'/%3E%3Cpath d='M12 4L4 8v8l8 4 8-4V8l-8-4z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M4 8l8 4 8-4M12 20v-8' stroke='white' stroke-width='1.6' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="app.css?v=qb4" />
  <!-- 适龄化显示增强：纯覆盖层，必须排在 app.css 之后 -->
  <link rel="stylesheet" href="aging.css?v=2" />
</head>
<body>
  <div id="login-root" class="login-root" hidden></div>
  <div id="app" class="app">
    <!-- ============ 左侧边栏 ============ -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" />
            <path d="M3 7l9 5 9-5" />
            <path d="M12 22V12" />
            <circle cx="12" cy="12" r="2.2" />
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">智造协同平台</div>
          <div class="brand-sub">Manufacturing Collaboration</div>
        </div>
      </div>
      <nav class="nav" id="main-nav" aria-label="主导航"></nav>
      <div class="sidebar-foot">
        <div class="env-card" id="env-card">
          <div class="env-row"><span class="env-label">运行环境</span><span class="env-value" id="env-mode">检测中…</span></div>
          <div class="env-row"><span class="env-label">框架版本</span><span class="env-value">V2.0.0</span></div>
        </div>
      </div>
    </aside>

    <!-- ============ 主区域 ============ -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-title" id="topbar-title">工作台</div>
          <div class="topbar-sub" id="topbar-sub">制造运营协同门户</div>
        </div>
        <div class="topbar-search">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="global-search" placeholder="搜索订单 / 工单 / 预警 / 报告…" autocomplete="off" />
        </div>
        <div class="topbar-right">
          <div class="backend-status" id="backend-status" title="后端连接状态">
            <span class="dot dot-checking" id="backend-dot"></span>
            <span id="backend-text">连接检测中</span>
          </div>
          <button class="icon-btn" id="btn-refresh" title="刷新当前页面">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
          <div class="user-chip" id="user-chip">
            <div class="avatar" id="user-avatar">总</div>
            <div class="user-meta">
              <div class="user-name" id="user-name">张明</div>
              <div class="user-role" id="user-role">总经理</div>
            </div>
          </div>
        </div>
      </header>
      <main class="content" id="screen-root" aria-live="polite"></main>
    </div>
  </div>

  <div class="toast-root" id="toast-root" aria-live="polite"></div>

  <!-- defer：并行下载且不阻塞首屏渲染。顺序保持 demo-data → terms → app → screens → help
       （依赖前序定义）。app.js 内部已在 DOMContentLoaded 时 boot()（带 readyState 兜底），
       无需额外引导脚本。公网隧道下白屏从 ~12s 降到 ~4s（GZipMiddleware 生效后更短）。 -->
  <script defer src="demo-data.js?v=perf2"></script>
  <script defer src="terms.js?v=perf2"></script>
  <script defer src="./scenes/registry.js"></script>
  <script defer src="./scenes/scene-kit.js"></script>
  <script defer src="./scenes/s00-skeleton.js"></script>
  <!-- T09：S4 批量监控与 ECN 场景屏（自注册到 SceneRegistry，不改 app.js） -->
  <script defer src="./scenes/s04-batch-ecn.js"></script>
  <!-- T11：S3 阶段门会签场景屏（自注册到 SceneRegistry，不改 app.js） -->
  <script defer src="./scenes/s03-stage-gate.js"></script>
  <!-- T10：S2 立项场景屏（自注册到 SceneRegistry，不改 app.js） -->
  <script defer src="./scenes/s02-npi-kickoff.js"></script>
  <!-- T07：S1 接单评审场景屏（自注册到 SceneRegistry，不改 app.js） -->
  <script defer src="./scenes/s01-intake.js"></script>
  <!-- T06：S5 出货与质量追溯场景屏（自注册到 SceneRegistry，不改 app.js） -->
  <script defer src="./scenes/s05-trace.js"></script>
  <!-- T08：S6 采购执行场景屏（自注册到 SceneRegistry，不改 app.js） -->
  <script defer src="./scenes/s06-procurement.js"></script>
  <script defer src="app.js?v=perf4"></script>
  <script defer src="screens.js?v=qb3"></script>
  <!-- 报告中心：覆盖 screens.js 的静态版 render_reports（新增文件，不改既有函数体） -->
  <script defer src="./reports-screen.js?v=1"></script>
  <script defer src="./case-screen.js?v=chat1"></script>
  <script defer src="./help-screen.js?v=perf3"></script>
  <!-- 悬浮帮助助手：自包含（不依赖加载顺序，运行时只读 window.App.state）-->
  <script defer src="./float-help.js"></script>
  <!-- 个性化主题切换器：自包含（明暗主题 + 主题色，偏好存 localStorage）-->
  <script defer src="./theme-switcher.js?v=1"></script>
  <!-- 适龄化显示模式：三档预设 + 撤销 + 快捷键（依赖上面的主题切换器先写好 data-theme） -->
  <script defer src="./aging-mode.js?v=2"></script>
  <script defer src="./kb-screen.js?v=perf2"></script>
  <script defer src="./office-screen.js?v=perf3"></script>
</body>
</html>
