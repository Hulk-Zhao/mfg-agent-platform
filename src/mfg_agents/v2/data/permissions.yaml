      - hitl.d8_close.cosign

  - key: pqe
    name: PQE
    dept: quality
    actor_kind: human
    aliases: [PQE, 制程质量工程师, 过程质量工程师]
    permissions:
      - hitl.disposition.propose
      - hitl.disposition.cosign
      - hitl.restart.cosign
      - hitl.d8_close.cosign
      - hitl.maintenance_window.cosign
      - hitl.spc_action.propose
      - hitl.spc_action.cosign

  - key: procurement
    name: 采购
    dept: procurement
    actor_kind: human
    aliases: [采购, 采购专员, procurement, purchasing]
    permissions:
      - hitl.disposition.cosign

  - key: planning
    name: 计划
    dept: supply_chain
