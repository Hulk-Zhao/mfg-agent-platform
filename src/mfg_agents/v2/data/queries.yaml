# 注册查询库（Text2SQLService 第②道通道：参数化执行，高频固定查询）。
# 每个查询定义：sql（参数化，:param 占位）/ tables（权限核验）/ keywords（路由匹配）/ desc（口径说明）。
# 与 V1 Agent 硬编码 SQL 等价——保证 line_stop_v2 与 V1 行为等价（同输入同结论结构）。
queries:
  mfg_oee:
    desc: "MES：指定线体/型号当日 OEE 与产出（等价 V1 ManufacturingAgent）"
    tables: [production_output]
    keywords: [OEE, 产出, 停线, 复线]
    sql: "SELECT record_date, line_code, product_model, planned_qty, actual_qty, oee, stop_duration_min FROM production_output WHERE line_code = :line AND product_model = :model AND record_date = '2026-10-15'"

  mfg_stop_ongoing:
    desc: "MES：进行中的停线事件（等价 V1 ManufacturingAgent）"
    tables: [line_stop_event]
    keywords: [停线, 何时复, 什么时候复]
    sql: "SELECT * FROM line_stop_event WHERE line_code = :line AND product_model = :model AND status = 'ongoing'"

  quality_defect_dist:
    desc: "QMS：不良分布聚合（等价 V1 QualityAgent）"
    tables: [quality_defect]
    keywords: [不良, 缺陷, 锡膏]
    sql: "SELECT defect_type, SUM(defect_qty) AS total_qty FROM quality_defect WHERE line_code = :line AND product_model = :model GROUP BY defect_type"

  supply_batches_today:
    desc: "SCM：今日到货来料批次（等价 V1 SupplyChainAgent）"
    tables: [material_batch]
    keywords: [来料, 批次, 供应商, IQC]
    sql: "SELECT batch_no, part_no, part_name, supplier, incoming_result FROM material_batch WHERE date(arrival_time) = '2026-10-15'"

  equip_alarms:
    desc: "EAM：线体设备异常告警（等价 V1 EquipmentAgent）"
    tables: [equipment_log]
    keywords: [设备, 告警, 参数, 预警]
    sql: "SELECT equipment_id, alarm_code, param_name, param_value FROM equipment_log WHERE line_code = :line AND is_abnormal = 1"

  warehouse_available:
    desc: "WMS：型号可用库存（on_hand - reserved，等价 V1 WarehouseAgent）"
    tables: [inventory]
    keywords: [能发, 可用]
    sql: "SELECT product_model, warehouse, on_hand_qty, reserved_qty, (on_hand_qty - reserved_qty) AS available_qty FROM inventory WHERE product_model = :model"

  shipment_status:
    desc: "TMS：型号发货单状态与 ETA（等价 V1 WarehouseAgent）"
    tables: [shipment]
    keywords: [发货, 在途, 交期]
    sql: "SELECT order_no, product_model, qty, ship_status, eta FROM shipment WHERE product_model = :model"

  # ============================================================
  # V2 增量（4 场景）：仅追加，不改上方旧 7 条（回归基线）
  # ============================================================

  # ---- S2 来料异常 ----
  iqc_batches_recent:
    desc: "QMS：本周期不合格来料批次（含 COA，供 SQE 判定）。演示口径：窗口>=2026-10-11（演示今天为 10-15；历史更早的 fail 批次走明细探查可查，不进今日判定）"
    tables: [material_batch]
    keywords: [来料, IQC, 不合格, 批次, COA]
    sql: "SELECT batch_no, part_no, part_name, supplier, incoming_result, coa_url, arrival_time FROM material_batch WHERE incoming_result = 'fail' AND date(arrival_time) >= '2026-10-11' ORDER BY arrival_time DESC LIMIT 5"

  batch_supplier_by_no:
    desc: "QMS：按批号查供应商与检验结论"
    tables: [material_batch]
    keywords: [批号, 供应商, 检验]
    sql: "SELECT batch_no, part_no, part_name, supplier, incoming_result FROM material_batch WHERE batch_no = :batch_no"

  supplier_followup:
    desc: "SRM：供应商到货/不合格统计（跟催与评级）"
    tables: [material_batch]
    keywords: [供应商, 跟催, 评级, 整改]
    sql: "SELECT supplier, part_no, part_name, COUNT(*) AS batch_cnt, SUM(CASE WHEN incoming_result='fail' THEN 1 ELSE 0 END) AS fail_cnt FROM material_batch GROUP BY supplier, part_no"

  inventory_available_all:
    desc: "WMS：库存可用量（on_hand - reserved，替代料/冻结评估）"
    tables: [inventory]
    keywords: [可用, 替代料, 冻结, 可用量]
    sql: "SELECT product_model, warehouse, on_hand_qty, reserved_qty, (on_hand_qty - reserved_qty) AS available_qty FROM inventory"

  # ---- S3 客户投诉 ----
  complaint_detail:
    desc: "CRM/QMS：客诉单明细（8D D2 问题界定）"
    tables: [customer_complaint]
    keywords: [客诉, 投诉, 华为, 8D]
    sql: "SELECT complaint_no, customer, product_model, batch_no, defect_desc, status FROM customer_complaint WHERE status = 'open' ORDER BY complaint_no DESC LIMIT 5"

  quality_defect_by_batch:
    desc: "QMS：按批号的不良分布（8D D4 过程分析）"
    tables: [quality_defect]
    keywords: [不良, 缺陷, 批号, 分布]
    sql: "SELECT defect_type, SUM(defect_qty) AS total_qty FROM quality_defect WHERE batch_no = :batch_no GROUP BY defect_type"

  # ---- S4 出货风险 ----
  orders_by_model:
    desc: "TMS：型号订单/发货单与交期（ATP 前置）"
    tables: [shipment]
    keywords: [订单, 交期, 发货, 能发]
    sql: "SELECT order_no, product_model, qty, ship_status, eta FROM shipment WHERE product_model = :model"

  shortage_by_model:
    desc: "WMS+TMS：型号库存与订单量（缺料/缺口推算）"
    tables: [inventory, shipment]
    keywords: [缺料, 齐套, 缺口, 备料]
    sql: "SELECT i.product_model, i.on_hand_qty, i.reserved_qty, s.qty AS ordered_qty FROM inventory i JOIN shipment s ON i.product_model = s.product_model"

  plan_by_model:
    desc: "MES：型号排产与产出（计划影响/窗口评估）"
    tables: [production_output]
    keywords: [排产, 计划, 产出]
    sql: "SELECT record_date, line_code, product_model, planned_qty, actual_qty FROM production_output WHERE product_model = :model"

  output_by_model:
    desc: "MES：型号产出达成与平均 OEE"
    tables: [production_output]
    keywords: [产出, 达成, OEE]
    sql: "SELECT product_model, SUM(actual_qty) AS actual_qty, AVG(oee) AS oee FROM production_output WHERE product_model = :model GROUP BY product_model"

  plan_impact_by_material:
    desc: "MES：来料异常影响的排产（按型号）"
    tables: [production_output]
    keywords: [排产影响, 计划调整]
    sql: "SELECT record_date, line_code, product_model, planned_qty, actual_qty FROM production_output WHERE product_model = :model"
  finance_policy_search:
    desc: "财务制度查询（借支/报销/发票/差旅/备用金）。鉴权：仅财务与总经理高管可查"
    tables: [finance_policy]
    keywords: [借支, 报销, 发票, 差旅, 开票, 备用金, 住宿标准, 伙食补助, 报销流程, 抬头]
    sql: "SELECT policy_no, category, title, content FROM finance_policy WHERE title LIKE '%'||:kw||'%' OR keywords LIKE '%'||:kw||'%' OR content LIKE '%'||:kw||'%' LIMIT 5"
  admin_policy_search:
    desc: "行政制度查询（会议室/餐饮/班车/社团/团建），全员可读"
    tables: [admin_policy]
    keywords: [会议室, 食堂, 班车, 团建, 社团, 餐饮, 会议预订, 行政]
    sql: "SELECT policy_no, category, title, content FROM admin_policy WHERE title LIKE '%'||:kw||'%' OR keywords LIKE '%'||:kw||'%' OR content LIKE '%'||:kw||'%' LIMIT 5"
  kbqa_policy_search:
    desc: "企业制度查询（品质/生产/供应链/设备/EHS/研发/仓储/售后等 16 类制造制度），全员可读"
    tables: [kbqa_policy]
    keywords: [品质制度, 生产制度, 采购制度, 设备管理, 安全环保, EHS, 研发流程, NPI, 仓储制度, 售后政策, 企业制度, 制度查询]
    sql: "SELECT dept_cn, policy_no, category, title, content FROM kbqa_policy WHERE dept_cn LIKE '%'||:kw||'%' OR title LIKE '%'||:kw||'%' OR keywords LIKE '%'||:kw||'%' OR content LIKE '%'||:kw||'%' LIMIT 5"
  project_milestones:
    desc: "项目/NPI 里程碑（EVT/DVT/PVT/MP 阶段、状态与风险）"
    tables: [project_milestone]
    keywords: [里程碑, NPI, EVT, DVT, PVT, 试产, 阶段, 项目]
    sql: "SELECT product_model, phase, milestone, status, owner, planned_end, actual_end, risk_note FROM project_milestone ORDER BY planned_end LIMIT 8"
  test_records_recent:
    desc: "最近测试记录（可靠性/功能/软件，含失效描述）"
    tables: [test_records]
    keywords: [测试, 跌落, 高低温, 可靠性, 回归, 失效]
    sql: "SELECT product_model, batch_no, test_type, test_item, result, defect_desc, tester, test_date FROM test_records ORDER BY test_date DESC LIMIT 6"

  # ============================================================
  # V3.5 增量（P0 工具层）：设备状态 / 质量追溯 / 库存 ATP 三查
  # （工具 asset.status / quality.trace / inventory.atp 的底座，仅追加不改上行）
  # ============================================================

  # ---- P0 设备域 ----
  asset_status_by_equipment:
    desc: "EAM：按设备号查最近状态与关键参数趋势（最新 20 条告警/参数记录，供设备健康初判）"
    tables: [equipment_log]
    keywords: [设备状态, 设备号, 参数趋势, 健康度, 告警]
    sql: "SELECT equipment_id, line_code, log_time, alarm_code, param_name, param_value, is_abnormal FROM equipment_log WHERE equipment_id = :equipment_id ORDER BY log_time DESC LIMIT 20"

  # ---- P0 质量域 ----
  quality_trace_by_batch:
    desc: "QMS：按批次号做正/反向追溯（来料批次 LEFT JOIN 不良记录，给出来料结论与不良分布）"
    tables: [material_batch, quality_defect]
    keywords: [批次追溯, 批号, 追溯, 正反向, 来料, 不良]
    sql: "SELECT m.batch_no, m.part_no, m.part_name, m.supplier, m.incoming_result, m.arrival_time, q.defect_type, q.defect_qty FROM material_batch m LEFT JOIN quality_defect q ON m.batch_no = q.batch_no WHERE m.batch_no = :batch_no"

  # ---- P0 库存域（ATP）----
  atp_by_model:
    desc: "WMS：按产品型号查库存可用量 ATP（available = on_hand - reserved）"
    tables: [inventory]
    keywords: [ATP, 可用量, 能发, 齐套, 型号库存, 型号可发]
    sql: "SELECT product_model, warehouse, on_hand_qty, reserved_qty, (on_hand_qty - reserved_qty) AS available_qty FROM inventory WHERE product_model = :model"

  # ============================================================
  # V3.6 增量（P1 工具层）：供应风险 / 日产出口径两查
  # （工具 supply.risk / schedule.what_if 的底座，仅追加不改上行）
  # ============================================================

  # ---- P1 供应域 ----
  supply_risk_by_part:
    desc: "SCM：按料号查来料批次到货与检验结论（供应风险判定取证，按到货时间倒序）"
    tables: [material_batch]
    keywords: [供应风险, 料号, 来料风险, 到料, 供应商]
    sql: "SELECT part_no, part_name, supplier, batch_no, incoming_result, arrival_time FROM material_batch WHERE part_no = :part_no ORDER BY arrival_time DESC LIMIT 20"

  # ---- P1 排产域（日均产出推演）----
  daily_output_by_model:
    desc: "MES：按产品型号查近 14 天每日产出（排产/交付影响确定性推演）"
    tables: [production_output]
    keywords: [日均产出, 日产出, 产能, 插单, 排产推演, 交付影响]
    sql: "SELECT product_model, record_date, actual_qty AS output_qty FROM production_output WHERE product_model = :model ORDER BY record_date DESC LIMIT 14"

  # ============================================================
  # V3.6 SPC 域（最小切片）：柏拉图 + 测量值取数（工具 spc.* 的底座，仅追加不改上行）
  # ============================================================

  quality_defect_pareto_all:
    desc: "QMS：全量不良分布聚合（不限定线体/型号，供 SPC 柏拉图排序与 80% 分界）"
    tables: [quality_defect]
    keywords: [柏拉图, 帕累托, pareto, 不良分布, 缺陷排序]
    sql: "SELECT defect_type, SUM(defect_qty) AS total_qty FROM quality_defect GROUP BY defect_type ORDER BY total_qty DESC"

  spc_measurements_by_characteristic:
    desc: "QMS/SPC：按特性查测量值（含 USL/LSL 与子组号，供能力分析/报表取数；数据源为 spc.ingest 导入）"
    tables: [spc_measurement]
    keywords: [测量值, 特性, 子组, SPC, 能力分析, Cp, Cpk, 报表]
    sql: "SELECT characteristic, subgroup_no, seq, value, usl, lsl, measured_at, source FROM spc_measurement WHERE characteristic = :characteristic ORDER BY subgroup_no, seq"

  spc_characteristics_recent:
    desc: "QMS/SPC：有测量值的特性清单（按测量条数倒序，供过程能力预警挑选待分析特性）"
    tables: [spc_measurement]
    keywords: [特性清单, 有哪些特性, 待分析特性, 过程能力特性]
    sql: "SELECT characteristic, COUNT(*) AS n FROM spc_measurement GROUP BY characteristic ORDER BY n DESC, characteristic"

  # ============================================================
  # V3.7 增量（企业综合助手·制造数据速查）：材料库存 / 成品库存 / 来料批次
  # （素材来自 seed_inventory.sql 三张新表；仅追加不改上行）
  # 口径：可用量 available = on_hand - reserved（冻结量不计可用）；库龄 age_days。
  # ============================================================

  # ---- 材料库存 ----
  # keywords 纪律（V3.7 修复）：泛化问法（"材料库存还有多少"）必须落到**无参**的
  # *_all/*_top；带 :param 的 by_* 只保留**必须显式给出编码**才成立的关键词，
  # 避免 QueryLibrary.match 把泛化问法打成 2 分命中 by_* 却抽不出参数而缺参崩溃。
  material_stock_by_part:
    desc: "WMS：按料号精确查材料库存（在库/预留/冻结/可用/safety/库龄），按仓库分行"
    tables: [material_inventory]
    keywords: [料号库存, 按料号, 料号查询, 该料号]
    sql: "SELECT part_no, part_name, category, warehouse, bin_location, batch_no, supplier, on_hand_qty, reserved_qty, frozen_qty, (on_hand_qty - reserved_qty) AS available_qty, safety_stock, age_days, last_move_date FROM material_inventory WHERE part_no = :part_no ORDER BY warehouse"

  material_stock_search:
    desc: "WMS：按关键字模糊查材料库存（料号/名称 LIKE，口语问法兜底，如 M8 螺栓）"
    tables: [material_inventory]
    keywords: [材料模糊, 物料名称, 名称库存, 螺栓, 电容, 电阻, 连接器, 外壳, 电池, 液晶屏, 彩盒, PCB, 库存]
    sql: "SELECT part_no, part_name, category, warehouse, bin_location, batch_no, on_hand_qty, reserved_qty, frozen_qty, (on_hand_qty - reserved_qty) AS available_qty, safety_stock, age_days FROM material_inventory WHERE part_no LIKE '%' || :kw || '%' OR part_name LIKE '%' || :kw || '%' ORDER BY part_no, warehouse"

  material_stock_all:
    desc: "WMS：全量材料库存速查（按料号+仓库分行，含可用量与安全库存）"
    tables: [material_inventory]
    keywords: [材料库存, 原材料库存, 物料库存, 库存速查, 在库, 原材料, 还有多少库存, 库存还有多少]
    sql: "SELECT part_no, part_name, category, warehouse, bin_location, batch_no, on_hand_qty, reserved_qty, frozen_qty, (on_hand_qty - reserved_qty) AS available_qty, safety_stock, age_days FROM material_inventory ORDER BY part_no, warehouse"

  material_shortage:
    desc: "WMS：材料缺料/低于安全库存清单（缺口 = safety_stock - 可用量，按料号汇总）"
    tables: [material_inventory]
    keywords: [缺料, 缺口, 安全库存, 备料, 齐套, 低于安全]
    sql: "SELECT part_no, part_name, category, SUM(on_hand_qty) AS on_hand_qty, SUM(reserved_qty) AS reserved_qty, SUM(on_hand_qty - reserved_qty) AS available_qty, MAX(safety_stock) AS safety_stock, (MAX(safety_stock) - SUM(on_hand_qty - reserved_qty)) AS shortage_qty FROM material_inventory GROUP BY part_no, part_name, category HAVING SUM(on_hand_qty - reserved_qty) < MAX(safety_stock) ORDER BY shortage_qty DESC"

  material_aging_top:
    desc: "WMS：材料库龄/呆滞 TOP10（按库龄天数倒序，>=90 天视为呆滞）"
    tables: [material_inventory]
    keywords: [库龄, 呆滞, 呆滞料, 积压, 长库龄, 老化]
    sql: "SELECT part_no, part_name, category, warehouse, bin_location, batch_no, on_hand_qty, age_days, last_move_date FROM material_inventory ORDER BY age_days DESC LIMIT 10"

  # ---- 成品库存 ----
  finished_stock_all:
    desc: "WMS：全量成品库存（型号/仓/批号/在库/预留/可用/安全库存/库龄）"
    tables: [finished_inventory]
    keywords: [成品库存, 成品仓, 成品, 备货, 成品有多少, 库存速查, 还有多少库存, 在库]
    sql: "SELECT product_model, warehouse, batch_no, on_hand_qty, reserved_qty, (on_hand_qty - reserved_qty) AS available_qty, safety_stock, age_days, last_move_date FROM finished_inventory ORDER BY product_model, warehouse"

  finished_stock_by_model:
    desc: "WMS：按产品型号查成品库存与可发量 ATP（available = on_hand - reserved）"
    tables: [finished_inventory]
    keywords: [型号成品, 成品可发, 型号可发, 型号库存]
    sql: "SELECT product_model, warehouse, batch_no, on_hand_qty, reserved_qty, (on_hand_qty - reserved_qty) AS available_qty, safety_stock, age_days FROM finished_inventory WHERE product_model = :model ORDER BY warehouse"

  # ---- 来料批次综合 ----
  incoming_batch_recent:
    desc: "QMS/WMS：近期来料批次综合（含 IQC 结论：合格/不合格/待检/让步接收）"
    tables: [incoming_batch]
    keywords: [来料批次, 近期来料, 待检, 让步接收, 特采, IQC]
    sql: "SELECT batch_no, part_no, part_name, supplier, arrival_time, qty, qualified_qty, inspect_status, warehouse, bin_location FROM incoming_batch ORDER BY arrival_time DESC LIMIT 10"

  incoming_batch_scan:
    desc: "QMS/WMS：来料批次全量扫描（供 Agent 按供应商/料号二次过滤，上限 60）"
    tables: [incoming_batch]
    keywords: [来料全量扫描, 批次扫描]
    sql: "SELECT batch_no, part_no, part_name, supplier, arrival_time, qty, qualified_qty, inspect_status, warehouse, bin_location FROM incoming_batch ORDER BY arrival_time DESC LIMIT 60"

  incoming_batch_by_no:
    desc: "QMS/WMS：按批号查来料综合（数量/合格数/结论/库位/COA）"
    tables: [incoming_batch]
    keywords: [批号, 检验结论, COA, 到货批次, 该批次]
    sql: "SELECT batch_no, part_no, part_name, supplier, arrival_time, qty, qualified_qty, inspect_status, warehouse, bin_location, coa_url FROM incoming_batch WHERE batch_no = :batch_no"

  incoming_batch_by_supplier:
    desc: "SRM：供应商来料合格率排行（按供应商汇总批次数/不合格数/合格率，无参）"
    tables: [incoming_batch]
    keywords: [供应商合格率, 来料合格率, 供应商评级, 供应商质量, 供应商排行]
    sql: "SELECT supplier, COUNT(*) AS batch_cnt, SUM(qty) AS total_qty, SUM(qualified_qty) AS qualified_qty, SUM(CASE WHEN inspect_status='fail' THEN 1 ELSE 0 END) AS fail_cnt, ROUND(100.0 * SUM(CASE WHEN inspect_status='pass' THEN 1 ELSE 0 END) / COUNT(*), 1) AS pass_rate FROM incoming_batch GROUP BY supplier ORDER BY fail_cnt DESC, supplier"

  batch_trace_full:
    desc: "QMS：批次综合追溯（来料综合 incoming_batch 关联传统来料结论与不良记录，正/反向）"
    tables: [incoming_batch, material_batch, quality_defect]
    keywords: [批次追溯, 追溯, 全链路追溯, 正向追溯, 反向追溯]
    sql: "SELECT b.batch_no, b.part_no, b.part_name, b.supplier, b.arrival_time, b.qty, b.qualified_qty, b.inspect_status, b.warehouse, b.bin_location, m.incoming_result AS legacy_result, q.defect_type, q.defect_qty FROM incoming_batch b LEFT JOIN material_batch m ON b.batch_no = m.batch_no LEFT JOIN quality_defect q ON b.batch_no = q.batch_no WHERE b.batch_no = :batch_no"

