# 对策受控词表（countermeasure）——词条来源：data/knowledge/*.jsonl 的
# effective_action 字段（校准刮刀压力 / 更换加热管 / 供应商 8D / 网板张紧 等真实写法）。
#
# 治理纪律同 defect_modes.yaml：人工归并、不自动新增。
# 对策是"可复用经验"的核心载体（PRD D2：共享的是经验三元组），因此**必须**是受控 code，
# 不是自由文本——自由文本会让"上次这么解决"无法被比对与复用。
