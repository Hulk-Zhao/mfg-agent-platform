# 缺陷模式受控词表（defect_mode）——词条来源：data/knowledge/*.jsonl 的 defect_type
# 与 equipment_ledger / process_standards 的真实工序写法，人工归并。
#
# 治理纪律（架构 §5.3 / R-A6）：
#   1. 新增词条走「申请 + 质量体系审批」，**不做自动新增**（防同义词爆炸）；
#   2. 同义词必须来自语料里真实出现过的写法，不臆造；
#   3. 关系深度 ≤ 2 跳（父级 → 子级），首期不上图库（裁定 A7）；
#   4. 编码规则 DM-<域>-<序号>，序号不复用。
#
# 词条构成：6 个组别码（父级，本身也可作为兜底归类）+ 16 个具体缺陷码。
