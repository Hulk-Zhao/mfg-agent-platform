# HITL 闸门理由目录（R3：审批中心「为什么必须人确认」的产品语义层）
#
# 与 permissions.yaml 的分工：那里定义「谁能 propose/cosign/approve」（治理
# 单一事实源），这里定义「这个槽位为什么必须人工在环」（产品语义）。两侧的
# key 必须一致——本文件只准引用 GOVERNANCE_SLOTS 已存在的槽位，多一个少一个
# 都是配置错误（守卫测试 tests/demo/test_gate_reasons.py 双向钉）。
#
# gate_class 口径（对标开沿参考图三类硬闸门 + 平台自有两类）：
#   对外消息 —— 说出的话对客户/外部生效，错了收不回来；
#   改排产   —— 动的是产能承诺，影响一片订单的交期；
#   动钱     —— **本期无专属槽位**（见文末缺口说明），interim 由来料处置
#              （disposition）的金额会签链承担；
#   质量关闭 —— 8D/客诉结论一旦关闭即成为对客口径；
#   报告审定 —— 报告是对外/对管理层的正式材料，发布即代表平台结论。
gates:
  - key: restart
    name: 复线决策
    gate_class: 改排产
    why: 复线意味着质量风险与产能代价的权衡结论，一旦执行影响整条产线的在制订单，必须由现场与质量共同拍板。

  - key: eta
    name: 对客 ETA 承诺
    gate_class: 对外消息
    why: ETA 是说给客户的正式交期，超期即违约；承诺口径必须经业务与产能双侧确认后才允许发出。

  - key: disposition
    name: 来料处置
    gate_class: 动钱（interim）
    why: 退货/换货/特采都涉及供应商结算与质量放行，让步接收尤其以质量风险换交付——必须从来料、业务、质量多方会签后执行。

  - key: d8_close
    name: 8D 报告关闭
    gate_class: 质量关闭
    why: 8D 关闭即根因与纠正措施被正式采信，后续对客口径以此为准；验证不充分就关闭等于把问题埋进客户手里。

  - key: complaint_reply
    name: 对客回复
    gate_class: 对外消息
    why: 客诉回复一旦发出即代表公司立场，措辞与承诺必须与 8D 结论一致并经 QA 会签，防止前线过度承诺。

  - key: delivery_commit
    name: 交期承诺
    gate_class: 对外消息
    why: 交期承诺以 ATP/排产测算为据，但测算有假设；正式承诺必须由有权解释假设的人确认，避免「系统算的」变成「公司欠的」。

  - key: maintenance_window
    name: 停机窗口
    gate_class: 改排产
    why: 停机窗口直接改变排产与交付节奏，立即停机还是计划窗口是产能与设备安全的交换，必须现场与计划共同决定。

  - key: spc_action
    name: 过程处置
    gate_class: 改排产
    why: 加严检验/工程介入/计划内暂停都会改变过程与节拍，处置力度必须与过程能力的证据匹配，由质量与工程确认后执行。

  - key: order_review
    name: 接单评审
    gate_class: 改排产
    why: 接单即锁定产能与交期承诺，价格/交期/产能任一维度不匹配就接，会把风险转移给生产与交付——必须业务发起、工程计划会签后终批。

  - key: report_publish
    name: 报告审定与派发
    gate_class: 报告审定
    why: 报告是对外与对管理层的正式结论材料，发布即代表平台与责任岗位的判定；数据缺口未闭合的报告不许带病发布。

# ---------------------------------------------------------------- 缺口说明（不许美化）
#
# 「动钱」类操作（加急采购、退供折价、备件紧急采购等）当前**没有专属槽位**：
# GOVERNANCE_SLOTS 10 槽按闸门语义命名，无一对应资金承诺。架构裁定（《架构
# 改造推荐方向》Q6/附二）：本期不虚构槽位，interim 口径为「复用 disposition
# 的金额会签链（fin 角色在 cosign 链）」；正式方案是新增 hitl.spend_commit
# （资金支出承诺，6 处改动链，~0.5 人日），待治理角色拍板绑定矩阵后实施。
# 本文件在该槽位落地后同步补录，落地前映射表必须如实展示此缺口。
