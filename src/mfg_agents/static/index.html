<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>制造业多Agent协同平台</title>
<style>
:root {
  --bg: #1a1a1a; --bg-2: #242424; --bg-3: #2d2d2d;
  --text: #e8e8e8; --text-2: #aaa; --text-3: #777;
  --border: #3a3a3a;
  --primary: #7c8cf8; --primary-2: #a78bfa;
  --green: #34d17b; --orange: #f59e0b; --blue: #60a5fa;
  --user-bg: #2d3748;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

.topbar {
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.logo {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700;
}
.topbar h1 { font-size: 15px; font-weight: 600; }
.topbar .sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.elapsed {
  margin-left: auto; font-size: 13px; color: var(--text-2);
  background: var(--bg-2); padding: 6px 14px; border-radius: 20px;
  font-variant-numeric: tabular-nums;
}
.elapsed.running::before {
  content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--orange); margin-right: 7px; animation: pulse 1s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }

.chat { flex: 1; overflow-y: auto; padding: 24px; }
.chat-inner { max-width: 760px; margin: 0 auto; }

/* 用户问题 */
.user-q {
  font-size: 15px; color: var(--text); margin-bottom: 20px; font-weight: 500;
}

/* 步骤流 */
.steps { margin: 16px 0; }
.step {
  display: flex; gap: 12px; padding: 8px 0; animation: in .3s ease both;
}
@keyframes in { from {opacity:0; transform: translateY(6px);} to {opacity:1; transform:none;} }
.step-icon {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  background: var(--bg-3);
}
.step.thinking .step-icon { background: rgba(124,140,248,.15); color: var(--primary); }
.step.tool .step-icon { background: rgba(96,165,250,.15); color: var(--blue); }
.step.rag .step-icon { background: rgba(167,139,250,.15); color: var(--primary-2); }
.step.report .step-icon { background: rgba(52,209,123,.15); color: var(--green); }
.step-body { flex: 1; min-width: 0; }
.step-title { font-size: 13.5px; color: var(--text); font-weight: 500; }
.step-detail {
  font-size: 12.5px; color: var(--text-3); margin-top: 3px; line-height: 1.6;
  font-family: "SF Mono", Consolas, monospace;
  word-break: break-all;
}
.step-time {
  font-size: 11px; color: var(--text-3); flex-shrink: 0;
  font-variant-numeric: tabular-nums; padding-top: 6px;
}

/* 最终报告 */
.report-card {
  margin-top: 20px; padding: 18px 20px;
  background: var(--bg-2); border-radius: 12px; border-left: 3px solid var(--green);
}
.report-label {
  font-size: 11px; color: var(--green); font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px;
}
.report-text { font-size: 14px; line-height: 1.85; color: var(--text); }
details.internal { margin-top: 14px; }
details.internal summary {
  font-size: 12px; color: var(--text-3); cursor: pointer; user-select: none;
}
details.internal pre {
  margin-top: 8px; padding: 12px; background: var(--bg); border-radius: 8px;
  font-size: 11.5px; overflow-x: auto; white-space: pre-wrap; word-break: break-all;
  color: var(--text-2);
}

/* 输入区 */
.input-area {
  flex-shrink: 0; padding: 14px 24px; background: var(--bg-2);
  border-top: 1px solid var(--border);
}
.input-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
.input-inner textarea {
  flex: 1; padding: 11px 14px; background: var(--bg-3); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 14px; font-family: inherit;
  resize: none; height: 44px; outline: none;
}
.input-inner textarea:focus { border-color: var(--primary); }
.send-btn {
  padding: 0 24px; background: var(--primary); color: #fff; border: none;
  border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
}
.send-btn:disabled { opacity: .4; cursor: not-allowed; }
.stop-btn {
  padding: 0 20px; background: #e74c3c; color: #fff; border: none;
  border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
}

.agent-group { margin-bottom: 6px; }
.group-header {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  background: #1e2230; border-radius: 10px; cursor: pointer; transition: background .2s;
}
.group-header:hover { background: #262b3d; }
.group-icon { font-size: 20px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #2a3040; border-radius: 8px; }
.group-body { flex: 1; min-width: 0; }
.group-title { font-size: 14px; font-weight: 600; color: #e8eaed; }
.group-summary { font-size: 12px; color: #9aa0a6; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group-time { font-size: 12px; color: #666; }
.group-arrow { font-size: 10px; color: #666; transition: transform .2s; }
.group-details { padding: 6px 14px 6px 58px; }
.detail-step {
  display: flex; align-items: center; gap: 8px; padding: 4px 0;
  font-size: 12px; color: #9aa0a6;
}
.d-icon { font-size: 14px; }
.d-text { flex: 1; }
.d-time { color: #555; font-size: 11px; }

.proc-toggle {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 14px; background: #1a1e2a; border-radius: 8px; cursor: pointer;
  font-size: 13px; color: #9aa0a6; margin-bottom: 8px;
}
.proc-toggle:hover { background: #222738; }
.proc-arrow { font-size: 10px; color: #666; }
.groups-container { margin-bottom: 8px; }
.msg-time { font-size: 12px; color: #666; padding: 6px 4px; }

/* 场景快捷 */
.scenes { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.scene {
  font-size: 12px; padding: 6px 12px; background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 16px; cursor: pointer; color: var(--text-2); transition: all .15s;
}
.scene:hover { border-color: var(--primary); color: var(--text); }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">M</div>
  <div>
    <h1>制造业多Agent协同平台</h1>
    <div class="sub">业务Agent编排 制造/品质/供应链/设备/FA 自动生成对客报告</div>
  </div>
  <div class="elapsed" id="elapsed">就绪</div>
</div>

<div class="chat" id="chat">
  <div class="chat-inner" id="inner">
    <div class="scenes" id="scenes"></div>
    <div id="messages"></div>
  </div>
</div>

<div class="input-area">
  <div class="input-inner">
    <textarea id="input" placeholder="输入业务问题，例如：A型号为什么停线？" autofocus></textarea>
    <button class="send-btn" id="send">发送</button>
    <button class="stop-btn" id="stop" style="display:none">■ 停止</button>
  </div>
</div>

<script>
const SCENES = [
  ["停线应急", "A型号今天在SMT-1线停线了，客户急单，什么时候能复线？"],
  ["来料异常", "今天IQC发现锡膏批次有问题，怎么处理？"],
  ["客户投诉", "华为投诉A型号BATCH-A-1008批次元件偏移，需要8D"],
  ["出货风险", "A型号今天能发多少货？客户催SO-20261015-01"],
  ["设备预警", "SMT-1线设备参数有异常吗？"],
];
const scenesEl = document.getElementById('scenes');
SCENES.forEach(([label, q]) => {
  const el = document.createElement('div');
  el.className = 'scene'; el.textContent = label;
  el.onclick = () => { document.getElementById('input').value = q; input.focus(); };
  scenesEl.appendChild(el);
});

const messagesEl = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const stopBtn = document.getElementById('stop');
const elapsedEl = document.getElementById('elapsed');

let abortController = null;

stopBtn.addEventListener('click', () => {
  if (abortController) abortController.abort();
});

const NODE_TYPE = {
  business:    ['thinking', '🧠', '业务Agent'],
  manufacturing: ['tool',    '🗄️', '制造Agent · 查MES'],
  quality:     ['tool',    '🔬', '品质Agent · 查QMS'],
  supply_chain:['tool',    '📦', '供应链Agent · 查SCM'],
  equipment:   ['tool',    '⚙️', '设备Agent · 查EAM'],
  warehouse:   ['tool',    '🏭', '仓储Agent · 查WMS'],
  fa:          ['rag',     '📚', 'FA分析Agent · RAG推理'],
  report:      ['report',  '📄', '报告Agent · 生成对客回复'],
};

let startTime = 0, timerHandle = null;

function tick() {
  const s = Math.floor((Date.now() - startTime) / 1000);
  const m = Math.floor(s / 60);
  const ss = s % 60;
  elapsedEl.textContent = '共用时 ' + (m > 0 ? m + '分' : '') + ss + '秒';
  elapsedEl.classList.add('running');
  // 更新正在执行的步骤时间
  if (currentGroup) {
    const steps = currentGroup.querySelectorAll('.detail-step');
    if (steps.length) {
      steps[steps.length - 1].querySelector('.d-time').textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
    }
    currentGroup.querySelector('.group-time').textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
  }
}

function send() {
  const q = input.value.trim();
  if (!q) return;
  sendBtn.disabled = true;
  sendBtn.style.display = 'none';
  stopBtn.style.display = '';

  abortController = new AbortController();

  // 清空旧消息，写用户问题
  messagesEl.innerHTML = '';
  const userEl = document.createElement('div');
  userEl.className = 'user-q';
  userEl.textContent = q;
  messagesEl.appendChild(userEl);

  const stepsEl = document.createElement('div');
  stepsEl.className = 'steps-wrapper';
  messagesEl.appendChild(stepsEl);

  // 整体折叠容器
  const procToggle = document.createElement('div');
  procToggle.className = 'proc-toggle';
  procToggle.innerHTML = '<span>📋 查看执行过程</span><span class="proc-arrow">▶</span>';
  stepsEl.appendChild(procToggle);
  const groupsEl = document.createElement('div');
  groupsEl.className = 'groups-container';
  groupsEl.style.display = 'none';
  stepsEl.appendChild(groupsEl);
  procToggle.onclick = () => {
    const open = groupsEl.style.display !== 'none';
    groupsEl.style.display = open ? 'none' : '';
    procToggle.querySelector('.proc-arrow').textContent = open ? '▶' : '▼';
  };

  const finalEl = document.createElement('div');
  finalEl.id = 'final';
  messagesEl.appendChild(finalEl);

  startTime = Date.now();
  tick();
  timerHandle = setInterval(tick, 500);

  fetch('/api/chat/stream', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({query: q}),
    signal: abortController.signal
  }).then(r => {
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    function pump() {
      return reader.read().then(({done, value}) => {
        if (done) { finish(); return; }
        buf += decoder.decode(value, {stream:true});
        let idx;
        while ((idx = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, idx);
          buf = buf.slice(idx+1);
          if (line.trim()) handle(JSON.parse(line));
        }
        return pump();
      });
    }
    return pump();
  }).catch(e => {
    if (e.name === 'AbortError') {
      finalEl.innerHTML = '<div style="color:var(--text-3);padding:8px 0">■ 已手动停止</div>';
    } else {
      finalEl.innerHTML = '<div style="color:#e74c3c">错误：' + e.message + '</div>';
    }
    finish();
  });

  function handle(ev) {
    if (ev.type === 'agent_start') {
      currentGroup = createGroup(ev.node, ev.icon || '•', ev.label, '处理中...');
    } else if (ev.type === 'tool_start' || ev.type === 'tool_end' || ev.type === 'llm_start') {
      if (currentGroup) addGroupStep(currentGroup, ev);
    } else if (ev.type === 'agent_end') {
      if (currentGroup) updateGroup(currentGroup, ev.summary || '');
    } else if (ev.type === 'final') {
      currentGroup = null;
      const now = new Date();
      const hh = String(now.getHours()).padStart(2,'0');
      const mm = String(now.getMinutes()).padStart(2,'0');
      const timeStr = `今天 ${hh}:${mm}`;
      finalEl.innerHTML = `
        <div class="report-card">
          <div class="report-label">✓ 对客报告</div>
          <div class="report-text">${ev.report || '（无报告）'}</div>
        </div>
        <div class="msg-time">${timeStr}</div>
        <details class="internal">
          <summary>内部简报（不对客）</summary>
          <pre>${JSON.stringify(ev.internal, null, 2)}</pre>
        </details>`;
      finish();
    } else if (ev.type === 'error') {
      finalEl.innerHTML = '<div style="color:#e74c3c">错误：' + ev.message + '</div>';
      finish();
    }
  }

  let currentGroup = null;

  function createGroup(type, icon, title, summary) {
    const groupTime = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
    const group = document.createElement('div');
    group.className = 'agent-group ' + type;
    group.innerHTML = `
      <div class="group-header">
        <div class="group-icon">${icon}</div>
        <div class="group-body">
          <div class="group-title">${title}</div>
          <div class="group-summary">${summary || ''}</div>
        </div>
        <div class="group-time">${groupTime}</div>
        <div class="group-arrow">▶</div>
      </div>
      <div class="group-details" style="display:none"></div>`;
    group.querySelector('.group-header').onclick = () => {
      const d = group.querySelector('.group-details');
      const a = group.querySelector('.group-arrow');
      const open = d.style.display !== 'none';
      d.style.display = open ? 'none' : '';
      a.textContent = open ? '▶' : '▼';
    };
    groupsEl.appendChild(group);
    document.getElementById('chat').scrollTop = 999999;
    return group;
  }

  function updateGroup(group, summary) {
    group.querySelector('.group-summary').textContent = summary;
    const t = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
    group.querySelector('.group-time').textContent = t;
  }

  function addGroupStep(group, ev) {
    const details = group.querySelector('.group-details');
    const stepTime = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
    let icon, title;
    if (ev.type === 'llm_start') { icon = '🧠'; title = ev.detail || 'LLM思考中'; }
    else if (ev.type === 'tool_start') { icon = '🔧'; title = `${ev.tool}: ${ev.detail || ''}`; }
    else { icon = '✅'; title = `${ev.tool}: ${ev.detail || ''}`; }
    const step = document.createElement('div');
    step.className = 'detail-step';
    step.innerHTML = `<span class="d-icon">${icon}</span><span class="d-text">${title}</span><span class="d-time">${stepTime}</span>`;
    details.appendChild(step);
    document.getElementById('chat').scrollTop = 999999;
  }

  function finish() {
    clearInterval(timerHandle);
    elapsedEl.classList.remove('running');
    tick();
    sendBtn.disabled = false;
    sendBtn.style.display = '';
    stopBtn.style.display = 'none';
    abortController = null;
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
