# ============================================================
# mfg-agent-platform Docker 编排（V3 演示入口：FastAPI + SSE）
#
# V3 演示链路默认使用本地 SQLite（data/mfg_agent.db）+ 本地 ChromaDB
# （data/chroma 持久化），无需外部数据库服务；entrypoint 首次启动
# 自动完成演示库初始化与知识库种子写入。
#
# 启动：docker compose up -d --build
# 访问：http://localhost:8004/demo-ui/
# 停止：docker compose down
# ============================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${DOCKER_BUILD_PROXY:-}
        HTTPS_PROXY: ${DOCKER_BUILD_PROXY:-}
    image: mfg-agent-platform:latest
    container_name: mfg_app
    # 关键：让容器真的读到 .env。之前只列了几个 LLM 变量，
    # .env 里的 DB_URL / VECTOR_BACKEND / MILVUS_URI / REDIS_URL / WORKFLOW_DB
    # 全部落空——"设了环境变量就能切中间件"这句话是假的。
    # 切 SQLite 演示栈还是 MySQL+Milvus 生产栈，只改 .env，不改编排。
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: 1
      # LLM 提供方：ollama（本地）/ deepseek / openai；留空自动识别
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      # 本地 Ollama：容器内经 host.docker.internal 访问宿主机
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      # DeepSeek / OpenAI 兼容接口（按需填写，见 .env.example）
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      DS_URL: ${DS_URL:-}
      DS_KEY: ${DS_KEY:-}
      # ---- 容器视角覆盖（必须在 env_file 之后，否则会盖掉 .env 的宿主机视角）----
      # .env 是**宿主机视角**写的：MILVUS_URI=localhost:19531 在容器里指向容器自己，
      # 连不到中间件容器。这里显式给出容器能用的默认值（与 OLLAMA_BASE_URL 同一套路）：
      # 默认经 host.docker.internal 访问宿主机已映射的端口。
      #
      # 若用组合启动 `docker compose -f docker-compose.yml -f docker-compose.infra.yml up`，
      # app 与中间件在同一网络（`mfg_infra`），应改用服务名，更快也更干净：
      #   CONTAINER_MILVUS_URI=http://milvus:19530
      #   CONTAINER_REDIS_URL=redis://redis:6379/0
      #   CONTAINER_DB_URL=mysql+pymysql://root:demo123@mysql:3306/mfg_agent
      #
      # DB_URL 留空 = 回落默认 SQLite（单容器演示形态）；治理库 WORKFLOW_DB 恒为 SQLite，
      # 见 services/workflow.py::assert_sqlite_backed。
      MILVUS_URI: ${CONTAINER_MILVUS_URI:-http://host.docker.internal:19531}
      REDIS_URL: ${CONTAINER_REDIS_URL:-redis://host.docker.internal:6380/0}
      DB_URL: ${CONTAINER_DB_URL:-}
    ports:
      - "8004:8004"
    volumes:
      # 演示库与向量库持久化（删除后下次启动自动重建）
      - app_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ---- 可选：V1 原型（Streamlit，8 Agent + MySQL）遗留链路 ----
  # 取消注释后可经 8501 访问 V1 UI；需要 MySQL 8.0
  # mysql:
  #   image: mysql:8.0
  #   container_name: mfg_mysql
  #   environment:
  #     MYSQL_ROOT_PASSWORD: demo123
  #     MYSQL_DATABASE: mfg_agent
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - mfg_net
  #   restart: unless-stopped

volumes:
  app_data:
